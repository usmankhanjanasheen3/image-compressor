<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Free online image compressor. Reduce image file size quickly while keeping good quality.">
<meta name="keywords" content="image compressor, compress image, reduce image size, photo compressor">

<title>Free Image Compressor - Compress JPG & PNG</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#17202a;
}

header{
background:#111827;
color:white;
padding:22px 15px;
text-align:center;
}

header h1{
margin:0;
font-size:28px;
}

header p{
margin:8px 0 0;
color:#d1d5db;
}

.container{
max-width:760px;
margin:30px auto;
padding:15px;
}

.card{
background:white;
border-radius:20px;
padding:25px;
box-shadow:0 8px 30px rgba(0,0,0,.08);
}

.upload{
border:2px dashed #9ca3af;
border-radius:16px;
padding:45px 15px;
text-align:center;
cursor:pointer;
display:block;
transition:.2s;
}

.upload:hover{
border-color:#111827;
}

.upload-icon{
font-size:45px;
display:block;
margin-bottom:10px;
}

input[type=file]{
display:none;
}

.controls{
margin-top:22px;
display:none;
}

label{
font-weight:bold;
}

input[type=range]{
width:100%;
margin-top:12px;
}

button{
border:0;
border-radius:12px;
padding:14px 20px;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin-top:15px;
width:100%;
}

#compressBtn{
background:#111827;
color:white;
}

#downloadBtn{
background:#15803d;
color:white;
display:none;
}

#resetBtn{
background:#e5e7eb;
color:#111827;
display:none;
}

.info{
display:none;
margin-top:20px;
padding:15px;
border-radius:12px;
background:#f3f4f6;
line-height:1.8;
}

.preview{
display:none;
margin-top:20px;
text-align:center;
}

.preview img{
max-width:100%;
max-height:400px;
border-radius:12px;
}

footer{
text-align:center;
padding:30px 15px;
color:#6b7280;
font-size:14px;
}

.small{
font-size:13px;
color:#6b7280;
margin-top:8px;
}
</style>
</head>

<body>
<nav style="background:#ffffff;padding:15px;text-align:center;border-bottom:1px solid #e5e7eb;">
  <a href="index.html" style="margin:0 8px;color:#111827;text-decoration:none;font-weight:bold;">Home</a>
  <a href="about.html" style="margin:0 8px;color:#111827;text-decoration:none;font-weight:bold;">About</a>
  <a href="privacy.html" style="margin:0 8px;color:#111827;text-decoration:none;font-weight:bold;">Privacy</a>
  <a href="contact.html" style="margin:0 8px;color:#111827;text-decoration:none;font-weight:bold;">Contact</a>
</nav>
<header>
<h1>🖼️ Free Image Compressor</h1>
<p>Compress your images quickly and easily</p>
</header>

<div class="container">

<div class="card">

<label class="upload" for="imageInput">
<span class="upload-icon">📁</span>
<strong>Tap to Select an Image</strong>
<div class="small">JPG, JPEG or PNG</div>
</label>

<input type="file" id="imageInput" accept="image/jpeg,image/png">

<div class="controls" id="controls">

<label>
Compression Quality:
<span id="qualityValue">70%</span>
</label>

<input type="range" id="quality" min="20" max="95" value="70">

<button id="compressBtn">Compress Image</button>

</div>

<div class="info" id="info"></div>

<div class="preview" id="preview">
<h3>Preview</h3>
<img id="previewImg" alt="Compressed image preview">
</div>

<button id="downloadBtn">⬇️ Download Compressed Image</button>

<button id="resetBtn">🔄 Compress Another Image</button>

</div>

</div>

<footer>
© 2026 Free Image Compressor
</footer>

<script>

let selectedFile = null;
let compressedData = null;

const imageInput = document.getElementById("imageInput");
const controls = document.getElementById("controls");
const quality = document.getElementById("quality");
const qualityValue = document.getElementById("qualityValue");
const compressBtn = document.getElementById("compressBtn");
const downloadBtn = document.getElementById("downloadBtn");
const resetBtn = document.getElementById("resetBtn");
const info = document.getElementById("info");
const preview = document.getElementById("preview");
const previewImg = document.getElementById("previewImg");

quality.addEventListener("input", function(){
qualityValue.textContent = quality.value + "%";
});

imageInput.addEventListener("change", function(){

selectedFile = this.files[0];

if(!selectedFile) return;

if(!selectedFile.type.match(/image\/(jpeg|png)/)){
alert("Please select a JPG, JPEG or PNG image.");
return;
}

controls.style.display = "block";
info.style.display = "none";
preview.style.display = "none";
downloadBtn.style.display = "none";
resetBtn.style.display = "none";

});

compressBtn.addEventListener("click", function(){

if(!selectedFile){
alert("Please select an image first.");
return;
}

const reader = new FileReader();

reader.onload = function(event){

const img = new Image();

img.onload = function(){

let canvas = document.createElement("canvas");
let ctx = canvas.getContext("2d");

let width = img.width;
let height = img.height;

const maxSize = 2000;

if(width > maxSize || height > maxSize){

if(width > height){
height = Math.round(height * maxSize / width);
width = maxSize;
}else{
width = Math.round(width * maxSize / height);
height = maxSize;
}

}

canvas.width = width;
canvas.height = height;

ctx.drawImage(img,0,0,width,height);

let qualityValueNumber = Number(quality.value) / 100;

compressedData = canvas.toDataURL(
"image/jpeg",
qualityValueNumber
);

previewImg.src = compressedData;

let originalKB = selectedFile.size / 1024;
let compressedKB = (compressedData.length * 0.75) / 1024;

let reduction = 100 - ((compressedKB / originalKB) * 100);

if(reduction < 0) reduction = 0;

info.innerHTML =
"<strong>Original Size:</strong> " +
originalKB.toFixed(1) +
" KB<br>" +

"<strong>Compressed Size:</strong> " +
compressedKB.toFixed(1) +
" KB<br>" +

"<strong>Size Reduced:</strong> " +
reduction.toFixed(1) +
"%";

info.style.display = "block";
preview.style.display = "block";
downloadBtn.style.display = "block";
resetBtn.style.display = "block";

};

img.src = event.target.result;

};

reader.readAsDataURL(selectedFile);

});

downloadBtn.addEventListener("click", function(){

if(!compressedData) return;

const link = document.createElement("a");

link.href = compressedData;
link.download = "compressed-image.jpg";

document.body.appendChild(link);
link.click();
document.body.removeChild(link);

});

resetBtn.addEventListener("click", function(){

selectedFile = null;
compressedData = null;

imageInput.value = "";

controls.style.display = "none";
info.style.display = "none";
preview.style.display = "none";
downloadBtn.style.display = "none";
resetBtn.style.display = "none";

});

</script>

</body>
</html>
